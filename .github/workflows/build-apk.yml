name: Build APK
on:
  workflow_dispatch:
    inputs:
      all_abis:
        description: 'هر دو APK (arm64 و گوشی‌های قدیمی armv7)؟ پیش‌فرض: فقط arm64 (سریع‌تر)'
        type: boolean
        default: false
  push:
    branches: [main]
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pubspec.yaml', 'tool/**') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Fetch Vazirmatn font
        run: |
          set -e
          mkdir -p assets/fonts /tmp/vz
          if [ ! -f assets/fonts/Vazirmatn-Regular.ttf ]; then
            (cd /tmp/vz && npm pack vazirmatn@33.0.3 --silent && tar -xzf vazirmatn-*.tgz)
            for w in Regular Medium Bold ExtraBold; do
              f=$(find /tmp/vz/package -name "Vazirmatn-$w.ttf" | head -1)
              test -n "$f" || { echo "::error::Vazirmatn-$w.ttf not found"; exit 1; }
              cp "$f" "assets/fonts/Vazirmatn-$w.ttf"
            done
          fi
          ls -la assets/fonts
      - name: Create Android shell
        run: flutter create --platforms=android --org com.jojo --project-name study_companion shell
      - name: Overlay sources
        run: |
          cp pubspec.yaml shell/pubspec.yaml
          rm -rf shell/lib shell/assets shell/test
          cp -r lib shell/lib
          cp -r assets shell/assets
          python3 tool/patch_android.py shell
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 تنظیم نشده؛ APK با کلید debug امضا می‌شود. هر بیلد کلید متفاوتی دارد پس روی نسخه‌ی قبلی نصب نمی‌شود و مجبور می‌شوی اپ را پاک کنی (= از دست رفتن داده‌های ارسال‌نشده). برای آپدیت بدون از دست رفتن داده حتماً امضای ثابت را تنظیم کن (README)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > shell/android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > shell/android/key.properties
          echo "release signing enabled"
      - name: Force compileSdk 34 for plugin modules
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/compilesdk.gradle <<'EOF'
          // اگر پلاگینی compileSdk نداشت، ۳۴ بگذار. موقع apply شدن پلاگین اجرا می‌شود
          // (نه afterEvaluate)، پس خطای «project is already evaluated» نمی‌دهد.
          allprojects {
            plugins.withId('com.android.library') {
              extensions.findByName('android')?.with { compileSdkVersion 34 }
            }
          }
          EOF
      - name: Pub get + fix plugin gradle files
        run: |
          cd shell
          flutter pub get
          python3 ../tool/fix_plugins.py .
          printf '\norg.gradle.parallel=true\norg.gradle.caching=true\nkotlin.incremental=false\n' >> android/gradle.properties
      - name: Analyze (informational, optional)
        if: ${{ false }}
        run: cd shell && (flutter analyze --no-fatal-infos --no-fatal-warnings || true)
      - name: Generate icon and splash
        run: |
          cd shell
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: Build APK
        env:
          ALL_ABIS: ${{ github.event.inputs.all_abis }}
        run: |
          cd shell
          PLATFORMS=android-arm64
          if [ "$ALL_ABIS" = "true" ]; then PLATFORMS=android-arm64,android-arm; fi
          flutter build apk --release --split-per-abi \
            --target-platform "$PLATFORMS" \
            --obfuscate --split-debug-info=build/symbols \
            --build-number=${{ github.run_number }}
          ls -la build/app/outputs/flutter-apk
      - uses: actions/upload-artifact@v4
        with:
          name: omid-apk-arm64
          path: shell/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ github.event.inputs.all_abis == 'true' }}
        with:
          name: omid-apk-armv7-old-phones
          path: shell/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: omid-symbols
          path: shell/build/symbols
